name: Deploy MkDocs to GitHub Pages

# Cloudflare migration (2026-10): this workflow is TEMPORARY. It keeps GitHub Pages serving
# cabinetofcuriosities.in until the domain moves to the Cloudflare Worker, then it is removed.
# It runs the same single build as Cloudflare and local `npm run build` (tools/build-site.mjs),
# so all three produce the same public/. See DEPLOYMENT.md.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    # Explicit rather than relying on the runner image's preinstalled Node.
    # The build needs no npm packages (Wrangler is only for Cloudflare
    # deploys), so there is no npm install step.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # requirements-lock.txt: the exact package versions every build uses
    # (Cloudflare, local .venv, here), so all of them produce the same site.
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    # The whole site build lives in tools/build-site.mjs: docs/index.md guard,
    # generated-content check, mkdocs --strict, external mounts at their pinned
    # revisions with only their allowlisted files (content/external-repos.tsv,
    # content/external-allowlists/), the archive through its allowlist,
    # sitemap.xml, route validation and the publication check.
    - name: Build site
      run: node tools/build-site.mjs

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
