name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Guard against docs/index.md
      run: |
        if [ -f docs/index.md ]; then
          echo "ERROR: docs/index.md must not exist. This site uses docs/index.html as the standalone Level 1 landing page. See archived-landing-pages/v2/LANDING-PAGE-NOTES.md."
          exit 1
        fi

    # --- Multi-repo assembly (Phase 1, hand-written per project -- #43) ---
    # To add another repo: copy this Checkout step + the Assemble/Validate
    # steps below it, repoint repository/path/destination. Full how-to:
    # documentation/backend-and-deploy/cabinet-multi-repo-assembly-concept-note-short.md
    # ("Quick reference" under section 11). ToDos: #43 this pattern,
    # #44 link it publicly, #46 verify live.
    - name: Checkout Working with AI
      uses: actions/checkout@v4
      with:
        repository: jesmehta/working-with-ai
        path: _external/working-with-ai

    - name: Checkout Prompt Generator
      uses: actions/checkout@v4
      with:
        repository: jesmehta/PromptGenerator
        path: _external/prompt-generator

    - name: Checkout Oblique Strategies
      uses: actions/checkout@v4
      with:
        repository: jesmehta/ObliqueStrategies
        path: _external/oblique-strategies

    - name: Checkout SSD Student Work
      uses: actions/checkout@v4
      with:
        repository: jesmehta/SSD_CreativeCodingPage
        path: _external/ssd-creative-coding

    - name: Checkout Swatch Fields
      uses: actions/checkout@v4
      with:
        repository: jesmehta/swatchFields
        path: _external/swatch-fields

    - name: Checkout Tracery Bots
      uses: actions/checkout@v4
      with:
        repository: jesmehta/TraceryBots
        path: _external/tracery-bots

    - name: Build MkDocs Site
      run: mkdocs build --site-dir public

    # Runs AFTER the MkDocs build so it lands in public/ without MkDocs
    # ever seeing it. All-or-nothing: Validate below fails `build` on a
    # broken copy, so `deploy` (needs: build) never ships it. #43
    - name: Assemble Working with AI
      run: |
        mkdir -p public/teaching/working-with-ai
        cp -r _external/working-with-ai/. public/teaching/working-with-ai/
        rm -rf public/teaching/working-with-ai/.git

    - name: Assemble Prompt Generator
      run: |
        mkdir -p public/teaching/prompt-generator
        cp -r _external/prompt-generator/. public/teaching/prompt-generator/
        rm -rf public/teaching/prompt-generator/.git

    - name: Assemble Oblique Strategies
      run: |
        mkdir -p public/teaching/oblique-strategies
        cp -r _external/oblique-strategies/. public/teaching/oblique-strategies/
        rm -rf public/teaching/oblique-strategies/.git

    - name: Assemble SSD Creative Coding 2025-26
      # The SSD repo was reorganised (2026-09-04) into a multi-gallery
      # "SSD Student Work" repo with its own root index.html/README/docs.
      # Those aren't wanted here -- Cabinet's own teaching/index.md is the
      # landing page for this section -- so copy only the one gallery
      # subfolder that has real content, not the repo root (copying the
      # root would silently overwrite public/teaching/index.html, the
      # MkDocs-built teaching page, with the SSD repo's own landing page).
      # Update this path (and add sibling steps) as the other five planned
      # galleries in that repo get built out.
      run: |
        mkdir -p public/teaching/ssd-creative-coding-2025-26
        cp -r _external/ssd-creative-coding/ssd-creative-coding-2025-26/. public/teaching/ssd-creative-coding-2025-26/

    - name: Assemble Swatch Fields
      run: |
        mkdir -p public/swatch-fields
        cp -r _external/swatch-fields/. public/swatch-fields/
        rm -rf public/swatch-fields/.git

    - name: Assemble Tracery Bots
      run: |
        mkdir -p public/tracery-bots
        cp -r _external/tracery-bots/. public/tracery-bots/
        rm -rf public/tracery-bots/.git

    - name: Validate assembled output
      run: |
        test -f public/teaching/working-with-ai/index.html || (echo "ERROR: assembled Working with AI is missing its index.html" && exit 1)
        test -f public/teaching/working-with-ai/working-with-ai/01.html || (echo "ERROR: assembled Working with AI is missing its own content" && exit 1)
        test -f public/teaching/prompt-generator/index.html || (echo "ERROR: assembled Prompt Generator is missing its index.html" && exit 1)
        test -f public/teaching/prompt-generator/app.js || (echo "ERROR: assembled Prompt Generator is missing its own content" && exit 1)
        test -f public/teaching/oblique-strategies/index.html || (echo "ERROR: assembled Oblique Strategies is missing its index.html" && exit 1)
        grep -q "Oblique Strategies" public/teaching/oblique-strategies/index.html || (echo "ERROR: assembled Oblique Strategies is missing its own content" && exit 1)
        test -f public/teaching/ssd-creative-coding-2025-26/index.html || (echo "ERROR: assembled SSD Creative Coding 2025-26 is missing its index.html" && exit 1)
        test -f public/teaching/ssd-creative-coding-2025-26/script.js || (echo "ERROR: assembled SSD Creative Coding 2025-26 is missing its own content" && exit 1)
        test -f public/swatch-fields/index.html || (echo "ERROR: assembled Swatch Fields is missing its index.html" && exit 1)
        test -f public/swatch-fields/swatch_lookup.json || (echo "ERROR: assembled Swatch Fields is missing its own content" && exit 1)
        test -f public/tracery-bots/index.html || (echo "ERROR: assembled Tracery Bots is missing its index.html" && exit 1)
        test -f public/tracery-bots/TrippyGourmetBot/sketch.js || (echo "ERROR: assembled Tracery Bots is missing TrippyGourmetBot content" && exit 1)
        test -f public/tracery-bots/MadSolutionistBot/sketch.js || (echo "ERROR: assembled Tracery Bots is missing MadSolutionistBot content" && exit 1)

    # Same pattern as the assembly above, local dir instead of a checkout --
    # makes colophon.md's v1/v2 links resolve instead of 404ing. #61
    - name: Copy archived landing pages
      run: cp -r archived-landing-pages public/archived-landing-pages

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
