name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Guard against docs/index.md
      run: |
        if [ -f docs/index.md ]; then
          echo "ERROR: docs/index.md must not exist. This site uses docs/index.html as the standalone Level 1 landing page. See LANDING-PAGE-NOTES.md."
          exit 1
        fi

    # v3.7.54 (#43) -- multi-repo assembly, phase 1 proof of concept.
    # See landing-v3/cabinet-multi-repo-assembly-concept-note-short.md
    # for the full architecture decision -- this is deliberately just
    # ONE project, hand-written, not yet the generalized manifest-driven
    # version (that's Phase 2, cabinet-multi-repo-assembly-concept-
    # note-short.md's own section 8/11). Checked out into a path OUTSIDE
    # docs/ so mkdocs build (below) never sees or processes it -- it's
    # plain static HTML with no build step of its own (confirmed by
    # inspection: no package.json/Makefile/gen.py committed, every path
    # inside is relative, nothing hardcodes jesmehta.github.io), so
    # "build" here is just "have the files."
    - name: Checkout Working with AI
      uses: actions/checkout@v4
      with:
        repository: jesmehta/working-with-ai
        path: _external/working-with-ai

    - name: Build MkDocs Site
      run: mkdocs build --site-dir public

    # Copied in AFTER the MkDocs build so it lands in the final output
    # tree at public/teaching/working-with-ai/ -- mkdocs build has no
    # awareness this directory exists, so it can never overwrite or be
    # overwritten by anything MkDocs itself generates under teaching/.
    # All-or-nothing per the concept note's own failure-behaviour
    # requirement (section 5/11): the validation step below exits
    # non-zero (failing this job, which the deploy job below depends on
    # via `needs: build`) rather than silently deploying a Cabinet
    # build missing its assembled content.
    - name: Assemble Working with AI
      run: |
        mkdir -p public/teaching/working-with-ai
        cp -r _external/working-with-ai/. public/teaching/working-with-ai/
        rm -rf public/teaching/working-with-ai/.git

    - name: Validate assembled output
      run: |
        test -f public/teaching/working-with-ai/index.html || (echo "ERROR: assembled Working with AI is missing its index.html" && exit 1)
        test -f public/teaching/working-with-ai/working-with-ai/01.html || (echo "ERROR: assembled Working with AI is missing its own content" && exit 1)

    # #61 -- archived-landing-pages/ lives at the repo root, outside
    # docs_dir, so it was never part of `mkdocs build`'s output at all;
    # the colophon page (docs/colophon.md) links straight to v1/v2, so
    # this makes those links actually resolve once deployed instead of
    # 404ing. Same "copy after the mkdocs build, into a path mkdocs
    # itself never touches" pattern as the Working with AI assembly
    # above, just a local directory instead of an external checkout.
    - name: Copy archived landing pages
      run: cp -r archived-landing-pages public/archived-landing-pages

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
