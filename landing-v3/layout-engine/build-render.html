<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>v3 build render source -- not for humans, see build-static.mjs</title>
  <link rel="stylesheet" href="../../docs/assets/css/cabinet-tokens.css" />
  <link rel="stylesheet" href="../shared/cabinet-v3-style.css" />
</head>
<body class="v3-proto" data-theme="medieval-map">
  <!-- No dev panel script (cabinet-v3-controls.js) on purpose -- build-static.mjs
       only extracts #v3-stage's rendered markup, and the static output must
       never contain the tuning panel. Loads cabinet-v3-layout.js directly, the
       exact same module islands-tool.html and index.template.html's pre-build
       predecessor used -- one rendering implementation, captured, not
       reimplemented.

       v3.6.10 -- .v3-header IS present here now (it wasn't before), even
       though only #v3-stage's outerHTML ever gets extracted (build-static.mjs
       never touches this element itself) -- render() sizes the full-bleed
       canvas around whatever viewport space is left below .v3-stage-wrap,
       so the CAPTURED svg needs the same header/viewport conditions
       index.template.html actually ships with, or the static build's baked
       shape would silently mismatch what real visitors see.
       v3.6.12 -- header reverted to a normal top-of-flow row (was: CSS
       overlay on the canvas's own corner) -- see index.template.html's
       own comment and documentation/Landing-page-notes.2.0.md's changelog. -->
  <header class="v3-header">
    <h1>Cabinet of Curiosities</h1>
    <p class="v3-subtitle">A map of worlds, of explorations across them, of curiosities followed, and the rabbitholes at the end of the rainbow.</p>
  </header>
  <main class="v3-stage-wrap">
    <svg id="v3-stage" class="v3-stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>
  <!-- #70 -- real h2/h3 heading outline, populated by cabinet-v3-layout.js's
       renderSemanticOutline(); build-static.mjs captures this element's
       outerHTML the same way it captures #v3-stage's, into index.template.html's
       V3_SEMANTIC_OUTLINE placeholder. -->
  <div id="v3-semantic-outline" class="sr-only"></div>
  <script type="module" src="cabinet-v3-layout.js"></script>
  <!-- v3.7.47 -- exposes getIslandLayoutState() on window so
       build-static.mjs's page.evaluate() can pull grown/canvasBounds
       out after render() finishes, to serialize for
       cabinet-v3-production-animate.js. Only exists here, in the
       build-time capture page -- never shipped to production, never
       loaded by islands-tool.html either. -->
  <script type="module">
    import { getIslandLayoutState } from "./cabinet-v3-layout.js";
    window.__v3GetIslandLayoutState = getIslandLayoutState;
  </script>
</body>
</html>
