extra:
  # Set your own social media below (or remove)
  social:
    # For other social icons at https://squidfunk.github.io/mkdocs-material/setup/adding-social-links/
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/cabofcuriosity
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jesal-mehta-8762404a/

theme:
  name: material
  custom_dir: overrides
  palette:
    # try other colors https://squidfunk.github.io/mkdocs-material/getting-started/#primary-colors
    primary: custom
    accent: indigo
  font:
    # See available fonts at https://fonts.google.com/
    text: Ubuntu
    code: Ubuntu Mono
  icon:
    logo: material/tortoise
  favicon: _images/favicon.svg
  features:
    # - navigation.tabs
    # - navigation.instant
    - navigation.expand
    # - navigation.sections

markdown_extensions:
  - extra
  - smarty
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - markdown_captions
  - attr_list

plugins:
  - mkdocs-video
  - section-index
  # Click-to-zoom overlay for every image, in place -- no new tab, no
  # link-wrapping needed in the markdown. See BACKEND-AND-DEPLOY.md's
  # "mkdocs-glightbox plugin" entry.
  - glightbox
  - redirects:
      redirect_maps:
        # docs/fffx/PackingShapes.md retired in favor of FFFX's canonical
        # copy (docs/tools-and-libraries/circle-packing-library.md there) --
        # the two had drifted (both needed the same malformed-link fix
        # separately). This keeps Cabinet's old URL alive for anything
        # still pointing at it instead of 404ing.
        fffx/PackingShapes.md: https://fffx.cabinetofcuriosities.in/tools-and-libraries/circle-packing-library/

extra_css:
  - _assets/material/css/extra.css
  - _assets/material/css/cabinet-material.css
  - _assets/backend/css/now.css

extra_javascript:
  - _assets/material/js/extra.js
